services:
  - type: web
    name: todak-ai
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_FALLBACK_MODEL
        sync: false
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_TIMEOUT_CHAT
        value: "4.5"
      - key: GEMINI_TIMEOUT_BG
        value: "12"
