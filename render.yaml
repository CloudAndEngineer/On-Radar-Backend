# Render Blueprint — On-Radar-Backend 레포 루트에 둡니다
services:
  - type: web
    name: todak-core
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DEMO_TODAY            # 시드 데이터 마지막 날
        value: "2026-11-21"
      - key: ALERT_STEP_MINUTES    # 시연 1~2, 운영 120
        value: "2"
      - key: AI_BASE_URL
        value: "https://todak-ai-zsgj.onrender.com/v1"
      - key: CORS_ALLOWED_ORIGINS  # 관리자 웹(Vercel) + 로컬 개발. 끝에 '/' 붙이지 않기
        value: "https://on-radar-web.vercel.app,http://localhost:5173"
      - key: FIREBASE_CREDENTIALS  # 서비스 계정 JSON 원문 또는 base64 (비우면 푸시는 로그만)
        sync: false
      - key: DEMO_CAREGIVER_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
